<div class="vx-grid-wrapper">
  <!-- Grid Header Toolbar -->
  <div class="vx-grid-toolbar" *ngIf="title || showQuickFilter || showExport || showRefresh || showDensityToggle">
    <div class="vx-grid-title-group" *ngIf="title">
      <h3 class="vx-grid-title">{{ title }}</h3>
      <p class="vx-grid-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
    </div>

    <div class="vx-grid-actions-group">
      <!-- Quick Search Filter -->
      <p-iconfield iconPosition="left" *ngIf="showQuickFilter">
        <p-inputicon class="pi pi-search"></p-inputicon>
        <input
          type="text"
          pInputText
          placeholder="Search records..."
          [value]="searchTerm()"
          (input)="onQuickFilterChanged($event)"
          class="p-inputtext-sm vx-search-input"
        />
        <p-inputicon
          *ngIf="searchTerm()"
          class="pi pi-times cursor-pointer"
          (click)="clearSearch()"
        ></p-inputicon>
      </p-iconfield>

      <!-- Refresh Button -->
      <p-button
        *ngIf="showRefresh"
        icon="pi pi-refresh"
        severity="secondary"
        [outlined]="true"
        size="small"
        pTooltip="Refresh Data"
        tooltipPosition="top"
        (onClick)="onRefresh()"
      ></p-button>

      <!-- Density Toggle -->
      <p-button
        *ngIf="showDensityToggle"
        [icon]="isDense() ? 'pi pi-bars' : 'pi pi-list'"
        severity="secondary"
        [outlined]="true"
        size="small"
        [pTooltip]="isDense() ? 'Comfortable Density' : 'Compact Density'"
        tooltipPosition="top"
        (onClick)="toggleDensity()"
      ></p-button>

      <!-- CSV Export -->
      <p-button
        *ngIf="showExport"
        icon="pi pi-download"
        label="Export CSV"
        severity="primary"
        [outlined]="true"
        size="small"
        (onClick)="exportCsv()"
      ></p-button>
    </div>
  </div>

  <!-- Selected rows counter banner -->
  <div class="vx-selection-banner" *ngIf="selectedRows().length > 0">
    <span><strong>{{ selectedRows().length }}</strong> row(s) selected</span>
  </div>

  <!-- PrimeNG Table -->
  <div class="vx-grid-table-container">
    <p-table
      #dt
      [value]="rowData || []"
      [loading]="loading"
      [paginator]="pagination"
      [rows]="pageSize"
      [rowsPerPageOptions]="[10, 20, 50, 100]"
      [globalFilterFields]="filterFields()"
      [selectionMode]="selectionMode === 'single' ? 'single' : undefined"
      [selection]="selectedRows()"
      (selectionChange)="onSelectionChange($event)"
      [class]="isDense() ? 'p-datatable-sm p-datatable-gridlines' : 'p-datatable-gridlines'"
      [scrollable]="true"
      [scrollHeight]="gridHeight"
    >
      <!-- Table Header -->
      <ng-template #header pTemplate="header">
        <tr>
          <!-- Selection Checkbox Header -->
          <th style="width: 3rem" *ngIf="selectionMode === 'multiple' && hasCheckboxSelection()">
            <p-tableheadercheckbox></p-tableheadercheckbox>
          </th>

          <!-- Columns -->
          <th
            *ngFor="let col of visibleColumns()"
            [pSortableColumn]="col.sortable !== false ? col.field : undefined"
            [style.width]="col.width ? col.width + 'px' : undefined"
            [style.minWidth]="col.minWidth ? col.minWidth + 'px' : '100px'"
          >
            <div class="flex items-center justify-between">
              <span>{{ col.headerName || col.field }}</span>
              <p-sorticon *ngIf="col.sortable !== false && col.field" [field]="col.field!"></p-sorticon>
            </div>
          </th>

          <!-- Row Actions Column Header -->
          <th *ngIf="actions.length > 0" style="width: 120px" class="text-center">Actions</th>
        </tr>
      </ng-template>

      <!-- Table Body -->
      <ng-template #body pTemplate="body" let-rowData>
        <tr
          (click)="onRowClick(rowData)"
          (dblclick)="onRowDblClick(rowData)"
          class="cursor-pointer"
        >
          <!-- Selection Checkbox Cell -->
          <td *ngIf="selectionMode === 'multiple' && hasCheckboxSelection()">
            <p-tablecheckbox [value]="rowData"></p-tablecheckbox>
          </td>

          <!-- Data Cells -->
          <td *ngFor="let col of visibleColumns()" [ngStyle]="getCellStyle(rowData, col)">
            <span [innerHTML]="getCellValue(rowData, col)"></span>
          </td>

          <!-- Row Actions Cell -->
          <td *ngIf="actions.length > 0" class="text-center">
            <div class="flex items-center justify-center gap-1">
              <ng-container *ngFor="let action of actions">
                <p-button
                  *ngIf="!action.isVisible || action.isVisible(rowData)"
                  [icon]="action.icon || 'pi pi-ellipsis-h'"
                  [label]="!action.icon ? action.label : ''"
                  [pTooltip]="action.label"
                  tooltipPosition="top"
                  [disabled]="action.isDisabled ? action.isDisabled(rowData) : false"
                  [text]="true"
                  [rounded]="true"
                  size="small"
                  [severity]="action.variant === 'danger' ? 'danger' : 'secondary'"
                  (onClick)="$event.stopPropagation(); action.onClick(rowData)"
                ></p-button>
              </ng-container>
            </div>
          </td>
        </tr>
      </ng-template>

      <!-- Empty State -->
      <ng-template #emptymessage pTemplate="emptymessage">
        <tr>
          <td [attr.colspan]="visibleColumns().length + (hasCheckboxSelection() ? 1 : 0) + (actions.length > 0 ? 1 : 0)" class="text-center py-8">
            <div class="vx-empty-container">
              <i class="pi pi-inbox text-4xl text-slate-400 mb-2"></i>
              <p class="font-semibold text-slate-700">{{ emptyTitle }}</p>
              <p class="text-xs text-slate-500 mt-1">{{ emptyMessage }}</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
