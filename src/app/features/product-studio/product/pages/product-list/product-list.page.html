<div class="vx-page-container">
  <!-- Page Header -->
  <div class="vx-page-header">
    <div class="vx-page-title-group">
      <h1>Insurance Product Catalog & Line of Business Studio</h1>
      <p>Configure rating algorithms, coverages, question matrices, underwriting guidelines, and policy forms</p>
    </div>
    <div class="vx-page-actions">
      <!-- Quick Open Reusable Drawer Button -->
      <button type="button" (click)="openProductDrawer()" class="btn btn-secondary btn-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M15 3v18"/>
        </svg>
        <span>Quick Drawer Spec</span>
      </button>

      <button *hasPermission="'PRODUCT_CREATE'" routerLink="/product-studio/products/create" class="btn btn-primary btn-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Create Full Product</span>
      </button>
    </div>
  </div>

  <!-- Scheduling & Expiry Toolbar -->
  <div class="vx-filter-toolbar" [formGroup]="scheduleForm">
    <div class="filter-item">
      <app-datepicker
        formControlName="expiryDate"
        label="Product Launch / Expiry Date"
        [startYear]="2025"
        minDate="2025-01-01"
        hint="2025 ke baad ke dates select karein"
      />
    </div>
  </div>

  <!-- AG Grid Enterprise Table -->
  <app-data-grid
    title="Product Portfolio"
    subtitle="Double-click any product row to enter the full Product Studio editor"
    [columnDefs]="columnDefs"
    [rowData]="products()"
    [loading]="loading()"
    [error]="error()"
    [showExport]="false"
    gridHeight="600px"
    (rowDoubleClicked)="onRowDoubleClicked($event)"
    (refreshClicked)="loadProducts()"
  />
</div>

<!-- ========================================================================= -->
<!-- 📦 REUSABLE DRAWER 1: PRODUCT STUDIO DRAWER (Custom Form Content)        -->
<!-- ========================================================================= -->
<app-drawer
  [isOpen]="isProductDrawerOpen"
  title="Quick Create Insurance Product"
  subtitle="Configure a new product line, rating code, and effective launch date"
  size="lg"
  [showFooter]="true"
  (closed)="closeProductDrawer()"
>
  <form [formGroup]="productForm" class="drawer-form-grid">
    <div class="form-row">
      <div class="form-col">
        <label class="form-label">Product Code <span class="required">*</span></label>
        <input
          type="text"
          formControlName="code"
          placeholder="e.g. GL-COMM-2026"
          class="form-control"
        />
      </div>
      <div class="form-col">
        <label class="form-label">Product Name <span class="required">*</span></label>
        <input
          type="text"
          formControlName="name"
          placeholder="e.g. Commercial General Liability Plus"
          class="form-control"
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-col">
        <label class="form-label">Line of Business <span class="required">*</span></label>
        <select formControlName="lineOfBusiness" class="form-control">
          <option value="COMMERCIAL_PROPERTY">Commercial Property</option>
          <option value="GENERAL_LIABILITY">General Liability</option>
          <option value="CYBER">Cyber & Tech E&O</option>
          <option value="WORKERS_COMP">Workers Compensation</option>
          <option value="COMMERCIAL_AUTO">Commercial Auto</option>
        </select>
      </div>
      <div class="form-col">
        <label class="form-label">Target Annual GWP ($) <span class="required">*</span></label>
        <input
          type="number"
          formControlName="annualGWP"
          placeholder="1500000"
          class="form-control"
        />
      </div>
    </div>

    <!-- Reusable AppDatepicker inside the Reusable Drawer -->
    <div class="form-row single-col">
      <app-datepicker
        formControlName="effectiveDate"
        label="Effective Policy Launch Date & Time"
        [startYear]="2025"
        minDate="2025-01-01"
        [enableTime]="false"
        hint="Select effective date starting 2025 onwards"
      />
    </div>
  </form>

  <div drawerFooter>
    <button type="button" class="btn btn-secondary btn-sm" (click)="closeProductDrawer()">Cancel</button>
    <button type="button" class="btn btn-primary btn-sm" (click)="saveProduct()">Save & Publish Product</button>
  </div>
</app-drawer>
