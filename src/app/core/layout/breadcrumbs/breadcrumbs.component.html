@if (breadcrumbs().length > 0) {
  <nav class="vx-breadcrumbs" aria-label="Breadcrumb">
    <ol class="vx-breadcrumb-list">
      <li class="vx-breadcrumb-item">
        <a routerLink="/dashboard" class="vx-breadcrumb-link">
          <svg class="vx-home-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </a>
      </li>

      @for (crumb of breadcrumbs(); track crumb.url; let last = $last) {
        <li class="vx-breadcrumb-separator">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </li>
        <li class="vx-breadcrumb-item" [class.is-active]="last">
          @if (!last) {
            <a [routerLink]="crumb.url" class="vx-breadcrumb-link">{{ crumb.label }}</a>
          } @else {
            <span class="vx-breadcrumb-current" aria-current="page">{{ crumb.label }}</span>
          }
        </li>
      }
    </ol>
  </nav>
}
